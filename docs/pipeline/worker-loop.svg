<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" role="img" aria-labelledby="worker-loop-title worker-loop-desc"><title id="worker-loop-title">02  What one computer-use worker does</title><desc id="worker-loop-desc">The model runs through an API. The CAD application runs inside a separate desktop.</desc><defs><marker id="worker-loop-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="1600" height="1080" fill="#faf9f6"/><text x="40" y="56" font-size="32" font-weight="700" fill="#243447">02  What one computer-use worker does</text><text x="40" y="96" font-size="20" fill="#637487">The model runs through an API. The CAD application runs inside a separate desktop.</text><path d="M 320 286 L 400 286" fill="none" stroke="#687b8c" stroke-width="2.4"  marker-end="url(#worker-loop-arrow)"/><path d="M 688 286 L 768 286" fill="none" stroke="#687b8c" stroke-width="2.4"  marker-end="url(#worker-loop-arrow)"/><rect x="685.0" y="249" width="86" height="24" fill="#faf9f6"/><text x="728" y="266" text-anchor="middle" font-size="15" fill="#637487">ACTIONS</text><path d="M 1088 286 L 1168 286" fill="none" stroke="#687b8c" stroke-width="2.4"  marker-end="url(#worker-loop-arrow)"/><path d="M 1312 364 L 1312.0 442.0 Q 1312 452 1302.0 452.0 L 554.0 452.0 Q 544 452 544.0 442.0 L 544 364" fill="none" stroke="#687b8c" stroke-width="2.4" stroke-dasharray="8 6" marker-end="url(#worker-loop-arrow)"/><rect x="847.0" y="413" width="146" height="24" fill="#faf9f6"/><text x="920" y="430" text-anchor="middle" font-size="15" fill="#637487">SCREEN + LOGS</text><path d="M 1480 364 L 1480 592" fill="none" stroke="#687b8c" stroke-width="2.4"  marker-end="url(#worker-loop-arrow)"/><rect x="1496.0" y="471" width="56" height="24" fill="#faf9f6"/><text x="1524" y="488" text-anchor="middle" font-size="15" fill="#637487">SAVE</text><path d="M 1168 670 L 1088 670" fill="none" stroke="#687b8c" stroke-width="2.4"  marker-end="url(#worker-loop-arrow)"/><path d="M 768 670 L 688 670" fill="none" stroke="#687b8c" stroke-width="2.4"  marker-end="url(#worker-loop-arrow)"/><rect x="40" y="208" width="280" height="156" rx="12" fill="#edf6ef" stroke="#9baab8" stroke-width="1.6" /><text x="60" y="242" font-size="23" font-weight="700" fill="#243447">Assigned job</text><text x="60" y="276" font-size="18" fill="#4e6276">Read product revision 3</text><text x="60" y="303" font-size="18" fill="#4e6276">Create / revise one artifact</text><text x="60" y="330" font-size="18" fill="#4e6276">Frozen acceptance criteria</text><rect x="400" y="208" width="288" height="156" rx="12" fill="#eaf2ff" stroke="#9baab8" stroke-width="1.6" /><text x="420" y="242" font-size="23" font-weight="700" fill="#243447">Worker model</text><text x="420" y="276" font-size="18" fill="#4e6276">GPT-6.1 Sol via Responses</text><text x="420" y="303" font-size="18" fill="#4e6276">Reads screens, plans actions</text><text x="420" y="330" font-size="18" fill="#4e6276">Can write tool scripts</text><rect x="768" y="208" width="320" height="156" rx="12" fill="white" stroke="#9baab8" stroke-width="1.6" /><text x="788" y="242" font-size="23" font-weight="700" fill="#243447">Your harness / adapter</text><text x="788" y="276" font-size="18" fill="#4e6276">Validates and executes tools</text><text x="788" y="303" font-size="18" fill="#4e6276">Screenshots, mouse, keyboard</text><text x="788" y="330" font-size="18" fill="#4e6276">Shell, file access, run limits</text><rect x="1168" y="208" width="392" height="156" rx="12" fill="white" stroke="#9baab8" stroke-width="1.6" /><text x="1188" y="242" font-size="23" font-weight="700" fill="#243447">Isolated desktop</text><text x="1188" y="276" font-size="18" fill="#4e6276">Daytona Linux or Windows</text><text x="1188" y="303" font-size="18" fill="#4e6276">FreeCAD OR KiCad + toolchain</text><text x="1188" y="330" font-size="18" fill="#4e6276">One active GUI worker per desktop</text><rect x="1168" y="592" width="392" height="156" rx="12" fill="#edf6ef" stroke="#9baab8" stroke-width="1.6" /><text x="1188" y="626" font-size="23" font-weight="700" fill="#243447">Saved artifact + provenance</text><text x="1188" y="660" font-size="18" fill="#4e6276">Source, STEP / board / binary</text><text x="1188" y="687" font-size="18" fill="#4e6276">Exact input revisions + output hash</text><text x="1188" y="714" font-size="18" fill="#4e6276">Upload from worker to shared storage</text><rect x="768" y="592" width="320" height="156" rx="12" fill="white" stroke="#9baab8" stroke-width="1.6" /><text x="788" y="626" font-size="23" font-weight="700" fill="#243447">Validator agent + tools</text><text x="788" y="660" font-size="18" fill="#4e6276">Inspect actual generated files</text><text x="788" y="687" font-size="18" fill="#4e6276">Run geometry / ERC / DRC tests</text><text x="788" y="714" font-size="18" fill="#4e6276">Compile and simulate firmware</text><rect x="400" y="592" width="288" height="156" rx="12" fill="#eaf2ff" stroke="#9baab8" stroke-width="1.6" /><text x="420" y="626" font-size="23" font-weight="700" fill="#243447">Job result</text><text x="420" y="660" font-size="18" fill="#4e6276">Pass / fail + evidence</text><text x="420" y="687" font-size="18" fill="#4e6276">Return to orchestrator</text><text x="420" y="714" font-size="18" fill="#4e6276">Publish or schedule repair</text><text x="40" y="872" font-size="22" fill="#243447">The harness is application code; the desktop provider supplies computer controls.</text><text x="40" y="906" font-size="22" fill="#243447">Use scripts / APIs for precise edits and computer use when the graphical interface is needed.</text><text x="40" y="940" font-size="22" fill="#243447">A failed check returns evidence for repair. Tests do not get weakened to make a run pass.</text><text x="40" y="1012" font-size="16" fill="#637487">Windows access and application compatibility must be checked. Start from a prepared desktop snapshot.</text></svg>
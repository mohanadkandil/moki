<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" role="img" aria-labelledby="overview-title overview-desc"><title id="overview-title">01  From idea to launch</title><desc id="overview-desc">One workspace. Real engineering artifacts. Every stage follows the same product revision.</desc><defs><marker id="overview-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="1600" height="1080" fill="#faf9f6"/><text x="40" y="56" font-size="32" font-weight="700" fill="#243447">01  From idea to launch</text><text x="40" y="96" font-size="20" fill="#637487">One workspace. Real engineering artifacts. Every stage follows the same product revision.</text><path d="M 328 242 L 416 242" fill="none" stroke="#687b8c" stroke-width="2.4"  marker-end="url(#overview-arrow)"/><path d="M 752 242 L 848 242" fill="none" stroke="#687b8c" stroke-width="2.4"  marker-end="url(#overview-arrow)"/><path d="M 1016 308 L 1016 396" fill="none" stroke="#687b8c" stroke-width="2.4"  marker-end="url(#overview-arrow)"/><path d="M 848 480 L 752 480" fill="none" stroke="#687b8c" stroke-width="2.4"  marker-end="url(#overview-arrow)"/><path d="M 752 428 L 848 428" fill="none" stroke="#687b8c" stroke-width="2.4" stroke-dasharray="8 6" marker-end="url(#overview-arrow)"/><rect x="757.0" y="391" width="86" height="24" fill="#faf9f6"/><text x="800" y="408" text-anchor="middle" font-size="15" fill="#637487">PUBLISH</text><path d="M 416 508 L 328 508" fill="none" stroke="#687b8c" stroke-width="2.4"  marker-end="url(#overview-arrow)"/><path d="M 328 436 L 416 436" fill="none" stroke="#687b8c" stroke-width="2.4" stroke-dasharray="8 6" marker-end="url(#overview-arrow)"/><rect x="334.0" y="399" width="76" height="24" fill="#faf9f6"/><text x="372" y="416" text-anchor="middle" font-size="15" fill="#637487">REPAIR</text><path d="M 184 564 L 184 676" fill="none" stroke="#687b8c" stroke-width="2.4"  marker-end="url(#overview-arrow)"/><rect x="196.0" y="603" width="56" height="24" fill="#faf9f6"/><text x="224" y="620" text-anchor="middle" font-size="15" fill="#637487">PASS</text><path d="M 328 748 L 416 748" fill="none" stroke="#687b8c" stroke-width="2.4"  marker-end="url(#overview-arrow)"/><path d="M 640 176 L 640.0 142.0 Q 640 132 650.0 132.0 L 1390.0 132.0 Q 1400 132 1400.0 142.0 L 1400 176" fill="none" stroke="#a57b25" stroke-width="2.4" stroke-dasharray="8 6" marker-end="url(#overview-arrow)"/><rect x="40" y="176" width="288" height="132" rx="12" fill="#eaf2ff" stroke="#9baab8" stroke-width="1.6" /><text x="60" y="210" font-size="23" font-weight="700" fill="#243447">Your workspace</text><text x="60" y="244" font-size="18" fill="#4e6276">Brief, references and edits</text><text x="60" y="271" font-size="18" fill="#4e6276">3D view + live worker screens</text><rect x="416" y="176" width="336" height="132" rx="12" fill="#eaf2ff" stroke="#9baab8" stroke-width="1.6" /><text x="436" y="210" font-size="23" font-weight="700" fill="#243447">Planner / orchestrator</text><text x="436" y="244" font-size="18" fill="#4e6276">Responses API · GPT-6.1 Sol</text><text x="436" y="271" font-size="18" fill="#4e6276">Plans jobs and dependencies</text><rect x="848" y="176" width="336" height="132" rx="12" fill="white" stroke="#9baab8" stroke-width="1.6" /><text x="868" y="210" font-size="23" font-weight="700" fill="#243447">Concept exploration</text><text x="868" y="244" font-size="18" fill="#4e6276">BFL creates visual directions</text><text x="868" y="271" font-size="18" fill="#4e6276">You choose a supported design</text><rect x="1240" y="176" width="320" height="180" rx="12" fill="#fff3da" stroke="#9baab8" stroke-width="1.6" stroke-dasharray="7 5"/><text x="1260" y="210" font-size="23" font-weight="700" fill="#243447">Optional: Decisions API</text><text x="1260" y="244" font-size="18" fill="#4e6276">GPT-6 Luna · fixed choices</text><text x="1260" y="271" font-size="18" fill="#4e6276">Route an edit / classify status</text><text x="1260" y="298" font-size="18" fill="#4e6276">Skip this in the first build</text><rect x="848" y="396" width="336" height="168" rx="12" fill="#edf6ef" stroke="#9baab8" stroke-width="1.6" /><text x="868" y="430" font-size="23" font-weight="700" fill="#243447">Versioned product contract</text><text x="868" y="464" font-size="18" fill="#4e6276">Agreed envelope + components</text><text x="868" y="491" font-size="18" fill="#4e6276">Artifact IDs, hashes, revisions</text><text x="868" y="518" font-size="18" fill="#4e6276">Workers publish measured outputs</text><rect x="416" y="396" width="336" height="168" rx="12" fill="white" stroke="#9baab8" stroke-width="1.6" /><text x="436" y="430" font-size="23" font-weight="700" fill="#243447">Engineering workers</text><text x="436" y="464" font-size="18" fill="#4e6276">Mechanical: FreeCAD / build123d</text><text x="436" y="491" font-size="18" fill="#4e6276">Electronics: KiCad</text><text x="436" y="518" font-size="18" fill="#4e6276">Firmware: compiler + simulator</text><rect x="40" y="396" width="288" height="168" rx="12" fill="#edf6ef" stroke="#9baab8" stroke-width="1.6" /><text x="60" y="430" font-size="23" font-weight="700" fill="#243447">Independent validators</text><text x="60" y="464" font-size="18" fill="#4e6276">Electrical + mechanical + code</text><text x="60" y="491" font-size="18" fill="#4e6276">Tool-based checks and tests</text><text x="60" y="518" font-size="18" fill="#4e6276">Fail → repair affected artifacts</text><rect x="40" y="676" width="288" height="144" rx="12" fill="white" stroke="#9baab8" stroke-width="1.6" /><text x="60" y="710" font-size="23" font-weight="700" fill="#243447">Product showcase</text><text x="60" y="744" font-size="18" fill="#4e6276">Render current CAD accurately</text><text x="60" y="771" font-size="18" fill="#4e6276">BFL backgrounds / lifestyle</text><text x="60" y="798" font-size="18" fill="#4e6276">Check visuals against the design</text><rect x="416" y="676" width="768" height="144" rx="12" fill="#eaf2ff" stroke="#9baab8" stroke-width="1.6" /><text x="436" y="710" font-size="23" font-weight="700" fill="#243447">Launch and build package</text><text x="436" y="744" font-size="18" fill="#4e6276">Landing page, brand copy, social assets + assembly instructions</text><text x="436" y="771" font-size="18" fill="#4e6276">CAD / PCB / firmware downloads with a matching revision</text><text x="436" y="798" font-size="18" fill="#4e6276">Manufacturing handoff; any paid order is a separate step</text><text x="40" y="916" font-size="22" fill="#243447">A new user edit creates a new revision. The orchestrator marks affected outputs stale,</text><text x="40" y="950" font-size="22" fill="#243447">reruns the required workers and validators, then refreshes the showcase and launch kit.</text><text x="40" y="1012" font-size="16" fill="#637487">Proposed architecture · Solid arrows: main flow · Dashed: optional helper or repair · No hardware is manufactured by this diagram.</text></svg>
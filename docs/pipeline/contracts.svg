<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" role="img" aria-labelledby="contracts-title contracts-desc"><title id="contracts-title">03  How electrical and mechanical stay in sync</title><desc id="contracts-desc">Agents exchange structured, versioned artifacts through the orchestrator—not guesses in a chat.</desc><defs><marker id="contracts-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="1600" height="1080" fill="#faf9f6"/><text x="40" y="56" font-size="32" font-weight="700" fill="#243447">03  How electrical and mechanical stay in sync</text><text x="40" y="96" font-size="20" fill="#637487">Agents exchange structured, versioned artifacts through the orchestrator—not guesses in a chat.</text><path d="M 360 254 L 440 254" fill="none" stroke="#687b8c" stroke-width="2.4"  marker-end="url(#contracts-arrow)"/><path d="M 760 254 L 840 254" fill="none" stroke="#687b8c" stroke-width="2.4"  marker-end="url(#contracts-arrow)"/><path d="M 1160 254 L 1240 254" fill="none" stroke="#687b8c" stroke-width="2.4"  marker-end="url(#contracts-arrow)"/><path d="M 1400 448 L 1400 604" fill="none" stroke="#687b8c" stroke-width="2.4"  marker-end="url(#contracts-arrow)"/><rect x="1422.0" y="511" width="116" height="24" fill="#faf9f6"/><text x="1480" y="528" text-anchor="middle" font-size="15" fill="#637487">CONSUME V3</text><path d="M 1240 682 L 1160 682" fill="none" stroke="#687b8c" stroke-width="2.4"  marker-end="url(#contracts-arrow)"/><path d="M 840 682 L 760 682" fill="none" stroke="#687b8c" stroke-width="2.4"  marker-end="url(#contracts-arrow)"/><path d="M 440 682 L 360 682" fill="none" stroke="#687b8c" stroke-width="2.4"  marker-end="url(#contracts-arrow)"/><rect x="40" y="176" width="320" height="156" rx="12" fill="#eaf2ff" stroke="#9baab8" stroke-width="1.6" /><text x="60" y="210" font-size="23" font-weight="700" fill="#243447">Agree the design envelope</text><text x="60" y="244" font-size="18" fill="#4e6276">Orchestrator owns constraints</text><text x="60" y="271" font-size="18" fill="#4e6276">Units, frame, size limits</text><text x="60" y="298" font-size="18" fill="#4e6276">Mechanical + electrical input</text><rect x="440" y="176" width="320" height="156" rx="12" fill="white" stroke="#9baab8" stroke-width="1.6" /><text x="460" y="210" font-size="23" font-weight="700" fill="#243447">Electrical worker</text><text x="460" y="244" font-size="18" fill="#4e6276">Save the actual KiCad board</text><text x="460" y="271" font-size="18" fill="#4e6276">Publish PCB revision 3</text><text x="460" y="298" font-size="18" fill="#4e6276">Include source + STEP model</text><rect x="840" y="176" width="320" height="156" rx="12" fill="#edf6ef" stroke="#9baab8" stroke-width="1.6" /><text x="860" y="210" font-size="23" font-weight="700" fill="#243447">Geometry extraction tool</text><text x="860" y="244" font-size="18" fill="#4e6276">Read the saved PCB file</text><text x="860" y="271" font-size="18" fill="#4e6276">Measure board, holes, ports</text><text x="860" y="298" font-size="18" fill="#4e6276">Record component envelopes</text><rect x="1240" y="176" width="320" height="272" rx="12" fill="#edf6ef" stroke="#9baab8" stroke-width="1.6" /><text x="1260" y="210" font-size="23" font-weight="700" fill="#243447">PCB geometry contract</text><text x="1260" y="244" font-size="18" fill="#4e6276">Example only: PCB revision 3</text><text x="1260" y="271" font-size="18" fill="#4e6276">board: 48 × 32 × 1.6 mm</text><text x="1260" y="298" font-size="18" fill="#4e6276">hole positions + diameters</text><text x="1260" y="325" font-size="18" fill="#4e6276">connector and height keepouts</text><text x="1260" y="352" font-size="18" fill="#4e6276">coordinate frame + artifact hash</text><text x="1260" y="379" font-size="18" fill="#4e6276">event: pcb.geometry.updated</text><rect x="1240" y="604" width="320" height="156" rx="12" fill="white" stroke="#9baab8" stroke-width="1.6" /><text x="1260" y="638" font-size="23" font-weight="700" fill="#243447">Mechanical worker</text><text x="1260" y="672" font-size="18" fill="#4e6276">Consume PCB revision 3</text><text x="1260" y="699" font-size="18" fill="#4e6276">Import its geometry + constraints</text><text x="1260" y="726" font-size="18" fill="#4e6276">Produce matching enclosure</text><rect x="840" y="604" width="320" height="156" rx="12" fill="white" stroke="#9baab8" stroke-width="1.6" /><text x="860" y="638" font-size="23" font-weight="700" fill="#243447">Cross-domain validators</text><text x="860" y="672" font-size="18" fill="#4e6276">Check actual board + enclosure</text><text x="860" y="699" font-size="18" fill="#4e6276">Clearance, mounts, connectors</text><text x="860" y="726" font-size="18" fill="#4e6276">Run electrical / firmware checks</text><rect x="440" y="604" width="320" height="156" rx="12" fill="#eaf2ff" stroke="#9baab8" stroke-width="1.6" /><text x="460" y="638" font-size="23" font-weight="700" fill="#243447">Revision gate</text><text x="460" y="672" font-size="18" fill="#4e6276">Case must reference PCB v3</text><text x="460" y="699" font-size="18" fill="#4e6276">Checks must cover these hashes</text><text x="460" y="726" font-size="18" fill="#4e6276">Block stale or failed outputs</text><rect x="40" y="604" width="320" height="156" rx="12" fill="white" stroke="#9baab8" stroke-width="1.6" /><text x="60" y="638" font-size="23" font-weight="700" fill="#243447">Consistent product bundle</text><text x="60" y="672" font-size="18" fill="#4e6276">Engineering files + evidence</text><text x="60" y="699" font-size="18" fill="#4e6276">Refresh renders and marketing</text><text x="60" y="726" font-size="18" fill="#4e6276">One traceable release revision</text><text x="40" y="864" font-size="22" fill="#243447">If PCB v3 becomes v4: invalidate dependent enclosure, fit checks, renders and launch assets.</text><text x="40" y="898" font-size="22" fill="#243447">Rebuild only what changed. The revision gate releases the package once the dependencies agree.</text><text x="40" y="932" font-size="22" fill="#243447">Validator agents interpret evidence; deterministic checks establish the defined pass/fail results.</text><text x="40" y="1012" font-size="16" fill="#637487">These checks establish design consistency and simulated behavior—not physical reliability, certification or fabrication success.</text></svg>